# apps/web-appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: web
  namespace: argocd
  finalizers:
    - argocd.argoproj.io/finalizer
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/toddlers/argocd-example-apps.git
        revision: HEAD
        directories:
          - path: kustomize-web/overlays/*
    - clusters: {}
  template:
    metadata:
      name: "web-{{.nameNormalized}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/toddlers/argocd-example-apps.git
        targetRevision: HEAD
        path: "kustomize-web/overlays/{{.nameNormalized}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "web-{{.nameNormalized}}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
