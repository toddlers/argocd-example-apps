# sync-demo/10-db.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector: { app: db }
  ports: [{ port: 6379, targetPort: 6379 }]
